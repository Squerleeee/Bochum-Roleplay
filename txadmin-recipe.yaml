$engine: 3
$onesync: on
name: Bochum Roleplay
version: 0.1.0
author: Bochum Roleplay
description: Deutsches BO Roleplay-Grundsystem mit Housing, Garage, Polizei, EMS und Survival.

tasks:
  # Connect first so txAdmin prompts for database settings and provides dbConnectionString.
  - action: connect_database

  # Cfx system resources: mapmanager, chat, spawnmanager, sessionmanager, and defaults.
  - action: download_github
    src: https://github.com/citizenfx/cfx-server-data
    ref: c6afa3909c763e3327ed76825e78453286c99f05
    subpath: resources
    dest: ./resources

  # Official oxmysql release archive, pinned to v2.14.3.
  - action: download_file
    url: https://github.com/overextended/oxmysql/releases/download/v2.14.3/oxmysql.zip
    path: ./tmp/oxmysql.zip
  - action: unzip
    src: ./tmp/oxmysql.zip
    dest: ./tmp/oxmysql-release
  - action: move_path
    src: ./tmp/oxmysql-release/oxmysql
    dest: ./resources/[standalone]/oxmysql
  - action: remove_path
    path: ./tmp

  # First publish resources/[bo] in a public GitHub repository.
  # Replace YOUR_GITHUB_USERNAME with the account that owns bochum-roleplay.
  - action: download_github
    src: https://github.com/YOUR_GITHUB_USERNAME/bochum-roleplay
    ref: main
    subpath: resources/[bo]
    dest: ./resources/[bo]

  - action: write_file
    file: ./server.cfg
    data: |
      # Bochum Roleplay - generated by the txAdmin recipe.
      # Configure server name, project metadata, locale and listing tags in the Cfx Portal.

      sv_enforceGameBuild 3751
      sv_licenseKey "{{svLicense}}"
      sv_maxclients {{maxClients}}
      {{serverEndpoints}}
      set onesync on
      set resources_useSystemChat true
      set mysql_connection_string "{{dbConnectionString}}"

      ensure mapmanager
      ensure chat
      ensure spawnmanager
      ensure sessionmanager
      ensure basic-gamemode
      ensure hardcap
      ensure oxmysql
      ensure bo_core
      ensure bo_survival
      ensure bo_ems
      ensure bo_police

      # txAdmin maps its managed master admins into this group.
      add_ace group.admin bo.admin allow
      {{addPrincipalsMaster}}
